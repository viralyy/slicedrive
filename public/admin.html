<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shortlink Admin - slicedrivee.site</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">
  <div class="max-w-7xl mx-auto px-6 py-8">

    <div class="flex justify-between items-center mb-12">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center text-black font-bold text-2xl">S</div>
        <div>
          <h1 class="text-3xl font-semibold tracking-tight">Shortlink</h1>
          <p class="text-zinc-500 text-sm">cdn.slicedrivee.site</p>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-8 border-b border-zinc-800">
      <button onclick="switchTab(0)" id="tab0" class="tab-btn active px-6 py-3 font-medium border-b-2 border-white text-white">Single Create</button>
      <button onclick="switchTab(1)" id="tab1" class="tab-btn px-6 py-3 font-medium text-zinc-400 hover:text-zinc-200">Bulk Create</button>
    </div>

    <!-- SINGLE CREATE -->
    <div id="panel0">
      <div class="glass border border-zinc-800 rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-6">Create New Shortlink</h2>
        <div class="flex flex-col md:flex-row gap-4">
          <input id="destination" type="url" placeholder="https://your-long-url.com/..." 
                 class="flex-1 bg-zinc-900 border border-zinc-700 focus:border-blue-600 rounded-2xl px-6 py-5 outline-none text-lg">
          <button onclick="createSingle()" 
                  class="bg-white text-black font-semibold px-10 py-5 rounded-2xl hover:bg-zinc-100 whitespace-nowrap">
            Generate Link
          </button>
        </div>
        <p id="single-result" class="mt-4 text-emerald-400 font-medium min-h-[28px]"></p>
      </div>
    </div>

    <!-- BULK CREATE -->
    <div id="panel1" class="hidden">
      <div class="glass border border-zinc-800 rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-6">Bulk Create Shortlinks</h2>
        <p class="text-zinc-400 mb-3">Masukkan satu link per baris</p>
        <textarea id="bulk-input" rows="12" 
                  class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl p-6 font-mono text-sm resize-y"
                  placeholder="https://example.com/video1&#10;https://example.com/video2&#10;https://example.com/video3"></textarea>
        
        <button onclick="createBulk()" 
                class="mt-6 bg-white text-black font-semibold px-8 py-4 rounded-2xl hover:bg-zinc-100">
          Create All Shortlinks
        </button>
        
        <div id="bulk-result" class="mt-6 text-sm"></div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="glass border border-zinc-800 rounded-3xl overflow-hidden mt-10">
      <div class="px-8 py-6 border-b border-zinc-800 flex justify-between items-center">
        <h2 class="text-xl font-semibold">All Shortlinks</h2>
        <span id="count" class="text-zinc-400"></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="border-b border-zinc-800 text-xs uppercase text-zinc-400">
              <th class="text-left pl-8 py-5">Shortlink</th>
              <th class="text-left py-5">Destination</th>
              <th class="text-right pr-8 py-5">Action</th>
            </tr>
          </thead>
          <tbody id="linkList" class="divide-y divide-zinc-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function switchTab(n) {
      document.getElementById('panel0').classList.toggle('hidden', n !== 0);
      document.getElementById('panel1').classList.toggle('hidden', n !== 1);
      
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === n);
        btn.classList.toggle('border-b-2', i === n);
        btn.classList.toggle('border-white', i === n);
        btn.classList.toggle('text-white', i === n);
        btn.classList.toggle('text-zinc-400', i !== n);
      });
    }

    function generateSlug() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let slug = "";
      for (let i = 0; i < 7; i++) slug += chars[Math.floor(Math.random() * chars.length)];
      slug += Math.floor(Math.random() * 10).toString();
      return slug;
    }

    async function createSingle() {
      const dest = document.getElementById('destination').value.trim();
      if (!dest) return alert("Masukkan link tujuan!");

      const slug = generateSlug();
      const result = document.getElementById('single-result');
      result.textContent = "Membuat shortlink...";

      const res = await fetch('/api/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug, destination: dest })
      });
      const data = await res.json();

      if (data.success) {
        result.innerHTML = `Berhasil → https://cdn.slicedrivee.site/<b>${slug}.mp4</b>`;
        document.getElementById('destination').value = '';
        loadLinks();
      } else {
        result.innerHTML = `<span class="text-red-400">${data.error || 'Gagal'}</span>`;
      }
    }

    async function createBulk() {
      const input = document.getElementById('bulk-input').value.trim();
      if (!input) return alert("Masukkan minimal 1 link!");

      const urls = input.split('\n').map(u => u.trim()).filter(u => u);
      const resultDiv = document.getElementById('bulk-result');
      resultDiv.innerHTML = `<p class="text-blue-400">Sedang memproses ${urls.length} link...</p>`;

      let success = 0;
      let logHTML = '<div class="mt-4 max-h-96 overflow-y-auto space-y-1">';

      for (const url of urls) {
        const slug = generateSlug();
        try {
          const res = await fetch('/api/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ slug, destination: url })
          });
          const data = await res.json();

          if (data.success) {
            success++;
            logHTML += `<div class="text-emerald-400">✅ ${slug}.mp4</div>`;
          } else {
            logHTML += `<div class="text-red-400">❌ ${url}</div>`;
          }
        } catch(e) {
          logHTML += `<div class="text-red-400">❌ ${url}</div>`;
        }
      }

      logHTML += '</div>';
      resultDiv.innerHTML = `<p class="font-medium">${success} dari ${urls.length} berhasil dibuat</p>` + logHTML;
      loadLinks();
    }

    async function loadLinks() {
      const res = await fetch('/api/list');
      const links = await res.json();
      document.getElementById('count').textContent = `${links.length} links`;

      let html = '';
      links.forEach(l => {
        const full = `https://cdn.slicedrivee.site/${l.slug}.mp4`;
        html += `
          <tr class="hover:bg-zinc-900 transition-colors">
            <td class="pl-8 py-5 font-mono text-blue-400">${l.slug}.mp4</td>
            <td class="py-5 text-zinc-300 truncate"><a href="\( {l.destination}" target="_blank" class="hover:underline"> \){l.destination}</a></td>
            <td class="pr-8 py-5 text-right">
              <button onclick="copyToClipboard('${full}')" class="mr-6 text-zinc-400 hover:text-white"><i class="fa-solid fa-copy"></i></button>
              <button onclick="deleteLink('${l.slug}')" class="text-red-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
      });

      document.getElementById('linkList').innerHTML = html || `<tr><td colspan="3" class="py-20 text-center text-zinc-500">Belum ada shortlink</td></tr>`;
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      alert('Link berhasil dicopy!');
    }

    async function deleteLink(slug) {
      if (!confirm(`Hapus ${slug}.mp4?`)) return;
      await fetch('/api/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({slug})
      });
      loadLinks();
    }

    window.onload = () => {
      loadLinks();
      switchTab(0);
    };
  </script>
</body>
</html>
