<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shortlink Admin - slicedrivee.site</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">
  <div class="max-w-7xl mx-auto px-6 py-8">

    <div class="flex justify-between items-center mb-10">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-black font-bold text-3xl">S</div>
        <div>
          <h1 class="text-4xl font-semibold tracking-tight">Shortlink</h1>
          <p class="text-zinc-500">cdn.slicedrivee.site</p>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-zinc-800 mb-8">
      <button onclick="switchTab(0)" id="tab0" class="tab active px-8 py-4 font-medium">Create Link</button>
      <button onclick="switchTab(1)" id="tab1" class="tab px-8 py-4 font-medium text-zinc-400">All Links</button>
    </div>

    <!-- CREATE PANEL -->
    <div id="panel0">
      <div class="glass border border-zinc-800 rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-6">Buat Shortlink Baru</h2>
        
        <div class="grid md:grid-cols-2 gap-8">
          <!-- Single -->
          <div>
            <label class="block text-sm text-zinc-400 mb-2">Single Link</label>
            <input id="singleUrl" type="url" placeholder="https://youtube.com/watch?v=..." 
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-6 py-5 focus:border-blue-600 outline-none text-lg">
            <button onclick="createSingle()" 
                    class="mt-4 w-full bg-white hover:bg-zinc-100 text-black font-semibold py-5 rounded-2xl transition">
              Generate Single
            </button>
          </div>

          <!-- Bulk -->
          <div>
            <label class="block text-sm text-zinc-400 mb-2">Bulk Links (1 link per baris)</label>
            <textarea id="bulkUrl" rows="6" placeholder="https://link1.com&#10;https://link2.com&#10;https://link3.com"
                      class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl p-6 resize-y font-mono"></textarea>
            <button onclick="createBulk()" 
                    class="mt-4 w-full bg-white hover:bg-zinc-100 text-black font-semibold py-5 rounded-2xl transition">
              Generate Bulk
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- LIST PANEL -->
    <div id="panel1" class="hidden">
      <div class="mb-6">
        <input id="searchInput" type="text" placeholder="Cari shortlink atau tujuan..." 
               onkeyup="searchLinks()" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-6 py-5 outline-none">
      </div>

      <div class="glass border border-zinc-800 rounded-3xl overflow-hidden">
        <div class="px-8 py-5 border-b border-zinc-800 flex justify-between items-center bg-zinc-900">
          <h2 class="font-semibold text-lg">Daftar Shortlink (<span id="totalCount">0</span>)</h2>
        </div>
        <div class="overflow-x-auto max-h-[70vh]">
          <table class="w-full">
            <thead class="sticky top-0 bg-zinc-900">
              <tr class="border-b border-zinc-800 text-xs text-zinc-400">
                <th class="text-left pl-8 py-5">SHORTLINK</th>
                <th class="text-left py-5">DESTINATION</th>
                <th class="text-right pr-8 py-5">AKSI</th>
              </tr>
            </thead>
            <tbody id="linksTable" class="divide-y divide-zinc-800"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl text-white"></div>

  <script>
    let linksData = [];

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.backgroundColor = isError ? '#ef4444' : '#10b981';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function switchTab(n) {
      document.getElementById('panel0').classList.toggle('hidden', n !== 0);
      document.getElementById('panel1').classList.toggle('hidden', n !== 1);
      
      document.querySelectorAll('.tab').forEach((el, i) => {
        el.classList.toggle('active', i === n);
        el.classList.toggle('text-white', i === n);
        el.classList.toggle('text-zinc-400', i !== n);
      });
    }

    function generateSlug() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let slug = "";
      for (let i = 0; i < 7; i++) {
        slug += chars[Math.floor(Math.random() * chars.length)];
      }
      slug += Math.floor(Math.random() * 10);
      return slug;
    }

    async function createSingle() {
      const url = document.getElementById('singleUrl').value.trim();
      if (!url) return showToast("Masukkan URL dulu!", true);

      const slug = generateSlug();
      
      try {
        const res = await fetch('/api/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, destination: url })
        });
        const data = await res.json();

        if (data.success) {
          showToast(`Berhasil dibuat: ${slug}.mp4`);
          document.getElementById('singleUrl').value = '';
          loadLinks();
        } else {
          showToast(data.error || "Gagal", true);
        }
      } catch (err) {
        showToast("Error: Pastikan D1 sudah terhubung", true);
      }
    }

    async function createBulk() {
      const text = document.getElementById('bulkUrl').value.trim();
      if (!text) return showToast("Masukkan link untuk bulk!", true);

      const urls = text.split('\n').map(u => u.trim()).filter(u => u);
      let success = 0;

      for (const url of urls) {
        const slug = generateSlug();
        try {
          const res = await fetch('/api/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ slug, destination: url })
          });
          const data = await res.json();
          if (data.success) success++;
        } catch(e) {}
      }

      showToast(`${success} dari ${urls.length} link berhasil dibuat`);
      document.getElementById('bulkUrl').value = '';
      loadLinks();
    }

    async function loadLinks() {
      try {
        const res = await fetch('/api/list');
        linksData = await res.json();
        renderTable(linksData);
      } catch (e) {
        console.error(e);
      }
    }

    function renderTable(data) {
      document.getElementById('totalCount').textContent = data.length;
      let html = '';

      data.forEach(item => {
        const fullLink = `https://cdn.slicedrivee.site/${item.slug}.mp4`;
        html += `
          <tr class="hover:bg-zinc-900 transition-colors">
            <td class="pl-8 py-5 font-mono text-blue-400">${item.slug}.mp4</td>
            <td class="py-5 text-zinc-300 truncate max-w-xl">${item.destination}</td>
            <td class="pr-8 py-5 text-right">
              <button onclick="copyLink('${fullLink}')" class="mr-6 text-zinc-400 hover:text-white transition">
                <i class="fa-solid fa-copy"></i>
              </button>
              <button onclick="deleteLink('${item.slug}')" class="text-red-400 hover:text-red-500 transition">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>`;
      });

      document.getElementById('linksTable').innerHTML = html || 
        `<tr><td colspan="3" class="py-20 text-center text-zinc-500">Belum ada shortlink</td></tr>`;
    }

    function searchLinks() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = linksData.filter(l => 
        l.slug.toLowerCase().includes(keyword) || 
        l.destination.toLowerCase().includes(keyword)
      );
      renderTable(filtered);
    }

    function copyLink(text) {
      navigator.clipboard.writeText(text);
      showToast("Link berhasil dicopy!");
    }

    async function deleteLink(slug) {
      if (!confirm(`Yakin menghapus ${slug}.mp4?`)) return;
      
      await fetch('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug })
      });
      showToast(`${slug}.mp4 telah dihapus`);
      loadLinks();
    }

    // Load pertama kali
    window.onload = () => {
      loadLinks();
      switchTab(0);
    };
  </script>
</body>
</html>
