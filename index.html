<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slicedrive</title>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#1f2937;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --primary:#6366f1;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:#020617;
  border-bottom:1px solid var(--border);
}

.logo{
  font-weight:700;
  font-size:15px;
}

/* CONTAINER */
.container{
  padding:16px;
  max-width:500px;
  margin:auto;
}

/* TITLE */
.title{
  font-size:20px;
  margin-bottom:12px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}

/* TABS */
.tabs{
  display:flex;
  background:#020617;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:12px;
}

.tab{
  flex:1;
  text-align:center;
  padding:10px;
  font-size:13px;
  cursor:pointer;
  color:var(--muted);
}

.tab.active{
  background:var(--card);
  color:white;
}

/* INPUT */
input,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
  margin-top:10px;
  font-size:14px;
}

/* BUTTON */
button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(90deg,#6366f1,#3b82f6);
  color:white;
}

/* RESULT */
.result{
  margin-top:10px;
  background:#020617;
  border:1px solid var(--border);
  padding:10px;
  border-radius:10px;
  font-size:13px;
  word-break:break-all;
  white-space:pre-wrap;
}

/* PROGRESS */
.progress{
  height:4px;
  background:#020617;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:var(--primary);
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  transition:.3s;
}
.toast.show{opacity:1}
</style>
</head>

<body>

<div class="header">
  <div class="logo">🚀 Slicedrive</div>
</div>

<div class="container">

<div class="title">Create Link</div>

<div class="card">

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('single')">Single URL</div>
  <div class="tab" onclick="switchTab('bulk')">Bulk URL</div>
</div>

<!-- SINGLE -->
<div id="singleBox">
  <input id="singleUrl" placeholder="Paste your long URL">
</div>

<!-- BULK -->
<div id="bulkBox" style="display:none;">
  <textarea id="bulkUrls" rows="5" placeholder="1 link per baris"></textarea>
</div>

<button onclick="handleGenerate()">Create Link</button>

<div class="progress"><div class="bar" id="bar"></div></div>

<div class="result" id="result"></div>

</div>

</div>

<div class="toast" id="toast">Copied</div>

<script>
const API_KEY = "bebas_isi_sendiri_123";
let mode = "single";

function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1500);
}

function switchTab(type){
  mode = type;

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");

  document.getElementById("singleBox").style.display = type==="single"?"block":"none";
  document.getElementById("bulkBox").style.display = type==="bulk"?"block":"none";
}

// MAIN GENERATE
async function handleGenerate(){
  if(mode==="single"){
    const url=document.getElementById("singleUrl").value;
    if(!url) return showToast("Isi link dulu");

    const res=await fetch(`/create?url=${encodeURIComponent(url)}&key=${API_KEY}`);
    const data=await res.json();

    navigator.clipboard.writeText(data.short);
    document.getElementById("result").innerText=data.short;

    showToast("Copied");
  }

  else{
    const raw=document.getElementById("bulkUrls").value;
    const urls=raw.split("\\n").filter(x=>x.trim());

    let hasil="";
    let done=0;

    for(let i=0;i<urls.length;i++){
      try{
        const res=await fetch(`/create?url=${encodeURIComponent(urls[i])}&key=${API_KEY}`);
        const data=await res.json();
        hasil += (i+1)+". "+data.short+"\\n";
      }catch{
        hasil += (i+1)+". ERROR\\n";
      }

      done++;
      document.getElementById("bar").style.width=(done/urls.length)*100+"%";
      document.getElementById("result").innerText=hasil;
    }

    navigator.clipboard.writeText(hasil);
    showToast("Bulk copied");
  }
}
</script>

</body>
</html>
