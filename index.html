<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShortDrive Link Creator</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#121212;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;}
.container{background:#1e1e1e;padding:30px;border-radius:12px;width:100%;max-width:450px;box-shadow:0 0 15px rgba(0,0,0,0.5);}
h1{margin:0 0 20px;text-align:center;font-size:22px;}
.tab{display:flex;margin-bottom:20px;border-radius:8px;overflow:hidden;border:1px solid #333;}
.tab button{flex:1;padding:10px 0;background:#2c2c2c;border:none;color:#aaa;font-weight:bold;cursor:pointer;transition:.2s;}
.tab button.active{background:#3a86ff;color:#fff;}
label{display:block;margin-bottom:5px;margin-top:10px;font-size:14px;color:#ccc;}
input, select, textarea{width:100%;padding:10px;border-radius:6px;border:none;margin-bottom:10px;background:#2c2c2c;color:#fff;outline:none;font-size:14px;}
button#create{width:100%;padding:12px;background:#3a86ff;border:none;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer;transition:.2s;}
button#create:hover{background:#1f65d1;}
#result{margin-top:15px;font-size:14px;line-height:1.5;}
.error{color:#ff5a5f;}
.success{color:#4caf50;word-break:break-word;}
</style>
</head>
<body>
<div class="container">
<h1>ShortDrive Link Creator</h1>
<div class="tab">
<button id="singleTab" class="active">Single URL</button>
<button id="bulkTab">Bulk URL</button>
</div>
<div id="formArea">
<label for="domain">Select Domain</label>
<select id="domain">
<option value="cdn.slicedrivee.site">cdn.slicedrivee.site</option>
</select>
<label for="alias">Custom Alias (Optional)</label>
<input type="text" id="alias" placeholder="my-brand">
<label for="url">Paste Your Long URL</label>
<textarea id="url" rows="2" placeholder="https://example.com"></textarea>
<button id="create">Create Link</button>
<div id="result"></div>
</div>
</div>

<script>
const singleTab = document.getElementById("singleTab");
const bulkTab = document.getElementById("bulkTab");
const urlInput = document.getElementById("url");
const createBtn = document.getElementById("create");
const resultDiv = document.getElementById("result");

singleTab.addEventListener("click",()=>{singleTab.classList.add("active");bulkTab.classList.remove("active");urlInput.rows=2;});
bulkTab.addEventListener("click",()=>{bulkTab.classList.add("active");singleTab.classList.remove("active");urlInput.rows=6;});

createBtn.addEventListener("click",async()=>{
resultDiv.textContent="";
const domain=document.getElementById("domain").value;
const alias=document.getElementById("alias").value.trim();
const urls=urlInput.value.trim().split("\n").filter(u=>u);
if(urls.length===0){resultDiv.innerHTML="<span class='error'>Please enter URL(s)</span>";return;}
createBtn.disabled=true;
createBtn.textContent="Processing...";
try{
const res=await fetch("https://slicedrive.pengecrotan45.workers.dev/api/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({domain,alias,urls:bulkTab.classList.contains("active")?urls:urls[0]})});
const data=await res.json();
if(data.ok){
const links=data.shortUrls.map(l=>`<a href='${l}' target='_blank'>${l}</a>`).join("<br>");
resultDiv.innerHTML=`<span class='success'>Shortlink created:<br>${links}</span>`;
}else{resultDiv.innerHTML=`<span class='error'>${data.error}</span>`;}
}catch(err){resultDiv.innerHTML=`<span class='error'>Network or Worker error</span>`;}
createBtn.disabled=false;
createBtn.textContent="Create Link";
});
</script>
</body>
</html>
