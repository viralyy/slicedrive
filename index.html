<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slicedrivee CDN</title>
<style>
  body { font-family: sans-serif; background:#1c1c2b; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; }
  .container { max-width:400px; width:90%; background:#2c2c3b; padding:20px; border-radius:12px; }
  input, select, button { width:100%; margin:8px 0; padding:10px; border-radius:8px; border:none; }
  button { background: linear-gradient(90deg, #667eea, #764ba2); color:#fff; cursor:pointer; font-weight:bold; }
  button:hover { opacity:0.9; }
  .error { color:#ff6b6b; margin-top:8px; font-size:0.9em; }
  textarea { min-height:100px; }
</style>
</head>
<body>

<div class="container">
  <h2>Slicedrivee CDN</h2>
  <select id="subdomain">
    <option value="cdn.slicedrivee.site">cdn.slicedrivee.site</option>
  </select>
  <input type="url" id="target" placeholder="Target URL (https://example.com)">
  <input type="text" id="slug" placeholder="Custom slug (optional)">
  <button id="create">Create Shortlink</button>
  <div class="error" id="error"></div>
  <textarea id="output" placeholder="Generated shortlinks..." readonly></textarea>
</div>

<script>
const WORKER_URL = "https://slicedrivee.pengecrotan45.workers.dev"; // ganti sesuai Worker-mu

document.getElementById("create").addEventListener("click", async () => {
  const target = document.getElementById("target").value.trim();
  const slug = document.getElementById("slug").value.trim();
  const errorEl = document.getElementById("error");
  const outputEl = document.getElementById("output");

  errorEl.textContent = "";
  if(!target){ errorEl.textContent = "Target URL wajib diisi!"; return; }

  try {
    const res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ target, slug })
    });
    if(!res.ok) throw new Error("Worker response error");
    const data = await res.json();
    if(data.ok){
      outputEl.value = data.shortlink;
    } else {
      errorEl.textContent = data.error || "Unknown error";
    }
  } catch(e){
    errorEl.textContent = "Fetch error: " + e.message;
  }
});
</script>

</body>
</html>
