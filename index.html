<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Slicedrive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f8fafc;
  margin: 0;
  color: #0f172a;
}

/* NAVBAR */
.nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: white;
  border-bottom: 1px solid #e2e8f0;
}

.logo {
  font-weight: bold;
  font-size: 18px;
}

/* HERO */
.hero {
  text-align: center;
  padding: 50px 20px;
}

.hero h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

.hero p {
  color: #64748b;
}

/* MAIN BOX */
.main-box {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

/* INPUT */
input, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #cbd5f5;
  margin-top: 10px;
}

/* BUTTON */
button {
  margin-top: 10px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  background: #e2e8f0;
  color: #0f172a;
}

/* RESULT */
.result {
  margin-top: 10px;
  background: #f1f5f9;
  padding: 10px;
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-all;
}

/* PROGRESS */
.progress {
  height: 6px;
  background: #e2e8f0;
  margin-top: 10px;
  border-radius: 10px;
}

.bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">🚀 Slicedrive</div>
</div>

<div class="hero">
  <h1>Simple & Fast Shortlink Tool</h1>
  <p>Buat shortlink .mp4 dengan cepat & gratis</p>
</div>

<div class="main-box">

<h3>Generate Link</h3>

<input id="singleUrl" placeholder="Masukkan link...">
<button onclick="genSingle()">Generate</button>

<div class="result" id="singleResult"></div>

<hr style="margin:20px 0">

<h3>Bulk Generator</h3>

<textarea id="bulkUrls" rows="5" placeholder="1 link per baris"></textarea>

<button onclick="genBulk()">Generate Bulk</button>
<button class="secondary" onclick="copyAll()">Copy All</button>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<div class="result" id="bulkResult"></div>

</div>

<script>
const API_KEY = "bebas_isi_sendiri_123";

// SINGLE
async function genSingle() {
  const url = document.getElementById("singleUrl").value;
  if (!url) return alert("Isi link dulu");

  const res = await fetch(`/create?url=${encodeURIComponent(url)}&key=${API_KEY}`);
  const data = await res.json();

  navigator.clipboard.writeText(data.short);

  document.getElementById("singleResult").innerText =
    data.short + " (copied)";
}

// BULK
async function genBulk() {
  const raw = document.getElementById("bulkUrls").value;
  const urls = raw.split("\n").filter(x => x.trim());

  let hasil = "";
  let done = 0;

  for (let i = 0; i < urls.length; i++) {
    try {
      const res = await fetch(`/create?url=${encodeURIComponent(urls[i])}&key=${API_KEY}`);
      const data = await res.json();
      hasil += (i+1) + ". " + data.short + "\n";
    } catch {
      hasil += (i+1) + ". ERROR\n";
    }

    done++;
    document.getElementById("bar").style.width = (done/urls.length)*100 + "%";
    document.getElementById("bulkResult").innerText = hasil;
  }
}

// COPY
function copyAll() {
  const text = document.getElementById("bulkResult").innerText;
  navigator.clipboard.writeText(text);
  alert("Copied!");
}
</script>

</body>
</html>
