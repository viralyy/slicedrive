<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slicedrive</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111827;
  --border:#1f2937;
  --text:#e5e7eb;
  --primary:#6366f1;
}

body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(180deg,#020617,#0b1220);
  color:var(--text);
}

/* HEADER */
.header{
  padding:14px;
  text-align:center;
  font-weight:600;
  border-bottom:1px solid var(--border);
}

/* CONTAINER */
.container{
  max-width:500px;
  margin:auto;
  padding:16px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:fade .4s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px)}
  to{opacity:1; transform:translateY(0)}
}

/* TABS */
.tabs{
  display:flex;
  background:#020617;
  border-radius:10px;
  margin-bottom:12px;
}

.tab{
  flex:1;
  text-align:center;
  padding:10px;
  cursor:pointer;
  color:#9ca3af;
  transition:.2s;
}

.tab.active{
  background:var(--card);
  color:white;
}

/* INPUT */
input,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
  margin-top:10px;
  font-size:14px;
}

/* BUTTON */
button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(90deg,#6366f1,#3b82f6);
  color:white;
  transition:.2s;
}

button:hover{
  transform:scale(1.02);
  opacity:.95;
}

/* LOADING */
.loading{
  text-align:center;
  margin-top:10px;
  font-size:13px;
  opacity:.7;
}

/* RESULT */
.result{
  margin-top:10px;
  background:#020617;
  border:1px solid var(--border);
  padding:10px;
  border-radius:10px;
  font-size:13px;
  white-space:pre-wrap;
  animation:fade .3s ease;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  padding:10px 16px;
  border-radius:10px;
  opacity:0;
  transition:.3s;
}
.toast.show{opacity:1}
</style>
</head>

<body>

<div class="header">🚀 Slicedrive</div>

<div class="container">

<div class="card">

<div class="tabs">
  <div class="tab active" onclick="switchTab('single',event)">Single</div>
  <div class="tab" onclick="switchTab('bulk',event)">Bulk</div>
</div>

<div id="singleBox">
  <input id="singleUrl" placeholder="Paste your URL">
</div>

<div id="bulkBox" style="display:none;">
  <textarea id="bulkUrls" rows="5" placeholder="1 link per baris"></textarea>
</div>

<button onclick="generate()">Create Link</button>

<div class="loading" id="loading" style="display:none;">Processing...</div>

<div class="result" id="result"></div>

</div>

</div>

<div class="toast" id="toast">Copied</div>

<script>
const API_KEY="bebas_isi_sendiri_123";
let mode="single";

function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1500);
}

function switchTab(type,e){
  mode=type;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  e.target.classList.add("active");

  document.getElementById("singleBox").style.display = type==="single"?"block":"none";
  document.getElementById("bulkBox").style.display = type==="bulk"?"block":"none";
}

async function generate(){
  const loading=document.getElementById("loading");
  const result=document.getElementById("result");

  loading.style.display="block";
  result.innerText="";

  if(mode==="single"){
    const url=document.getElementById("singleUrl").value;
    if(!url){loading.style.display="none"; return;}

    const res=await fetch(`/create?url=${encodeURIComponent(url)}&key=${API_KEY}`);
    const data=await res.json();

    result.innerText=data.short;
    navigator.clipboard.writeText(data.short);
    showToast("Copied");
  }

  else{
    const raw=document.getElementById("bulkUrls").value;
    const urls=raw.split("\n").filter(x=>x.trim());

    let hasil="";

    for(let i=0;i<urls.length;i++){
      try{
        const res=await fetch(`/create?url=${encodeURIComponent(urls[i])}&key=${API_KEY}`);
        const data=await res.json();
        hasil += (i+1)+". "+data.short+"\\n";
      }catch{
        hasil += (i+1)+". ERROR\\n";
      }
    }

    result.innerText=hasil;
    navigator.clipboard.writeText(hasil);
    showToast("Bulk copied");
  }

  loading.style.display="none";
}
</script>

</body>
</html>
