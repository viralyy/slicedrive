<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slicedrivee CDN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
  <style>
    * {
      margin:0; padding:0; box-sizing:border-box;
    }
    html, body {
      height:100%;
      font-family: 'Inter', Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #5859f2 35%, transparent 30%),
        radial-gradient(circle at 80% 20%, #00ffc8 14%, transparent 28%),
        #07070b;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:20px;
      overflow-y:auto; /* supaya geser refresh bisa */
      -webkit-overflow-scrolling: touch; /* smooth scroll iOS */
    }
    .card {
      width:100%;
      max-width:580px;
      background: rgba(18,18,28,.95);
      border-radius:28px;
      border:1px solid rgba(255,255,255,.08);
      padding:32px;
      box-shadow:0 35px 90px rgba(0,0,0,.45);
      animation:fadeUp 0.7s ease;
    }
    h1 {
      font-size:clamp(32px,6vw,72px);
      color:white;
      margin-bottom:10px;
      text-align:center;
    }
    p {
      color:#aaa;
      margin-bottom:25px;
      text-align:center;
      line-height:1.5;
    }
    .tabs {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:22px;
    }
    .tab {
      padding:14px;
      border-radius:16px;
      background:#101018;
      color:#aaa;
      font-weight:700;
      cursor:pointer;
      transition:.3s;
    }
    .tab.active { background:#5865f2; color:white; }
    .grid { display:grid; gap:14px; }
    label { font-size:13px; color:#bbb; margin-top:6px; display:block; }
    input, select, textarea, button {
      width:100%; border-radius:16px; font-size:15px; outline:none; border:none;
    }
    input, select, textarea {
      padding:14px;
      background:#0d0d14;
      color:white;
      border:1px solid rgba(255,255,255,.08);
    }
    input:focus, select:focus, textarea:focus { border-color:#5865f2; }
    textarea { height:150px; resize:vertical; }
    button.btn {
      padding:16px;
      margin-top:16px;
      background:linear-gradient(135deg,#5865f2,#8b5cf6);
      color:white;
      font-weight:700;
      cursor:pointer;
      transition:.3s;
    }
    button.btn:hover { opacity:.95; }
    .results {
      margin-top:22px;
      display:grid;
      gap:12px;
      max-height:220px;
      overflow-y:auto;
      border-radius:14px;
    }
    .result {
      background:#0b0b11;
      border:1px solid rgba(255,255,255,.07);
      padding:13px;
      border-radius:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      max-height:48px;
    }
    .result a {
      color:#9aa0ff;
      text-decoration:none;
      word-break:break-all;
    }
    .copy {
      background:#1d1d2b;
      color:#fff;
      border-radius:10px;
      padding:6px 10px;
      font-size:12px;
      cursor:pointer;
      border:none;
      transition:.2s;
    }
    .copy:hover { opacity:.8; }
    #bulkCopyAll {
      margin-top:6px;
      margin-bottom:6px;
      background:#5865f2;
      color:white;
      padding:10px 12px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      transition:.2s;
    }
    #bulkCopyAll:hover { opacity:.9; }
    .footer { margin-top:18px; text-align:center; color:#777; font-size:12px; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    .hidden { display:none; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Slicedrivee CDN</h1>
    <p>Generate shortlinks with <b>.mp4</b> style. Choose subdomain, single or bulk, animated UI.</p>

    <div class="tabs">
      <button class="tab active" onclick="setMode('single')">Short 1 Link</button>
      <button class="tab" onclick="setMode('bulk')">Bulk Short</button>
    </div>

    <div class="grid">
      <label>Choose Subdomain
        <select id="domain">
          <option value="cdn.slicedrivee.site">cdn.slicedrivee.site</option>
          <option value="cdn2.slicedrivee.site">cdn2.slicedrivee.site</option>
          <option value="media.slicedrivee.site">media.slicedrivee.site</option>
        </select>
      </label>

      <!-- Single -->
      <div id="singleBox">
        <label>Target URL<input id="target" placeholder="https://example.com"></label>
        <label>Custom Slug optional<input id="custom" placeholder="abcde432"></label>
      </div>

      <!-- Bulk -->
      <div id="bulkBox" class="hidden">
        <label>Bulk URLs (one per line)
          <textarea id="bulk" placeholder="https://example.com&#10;https://google.com"></textarea>
        </label>
        <button id="bulkCopyAll">Copy All Links</button>
      </div>

      <button class="btn" id="btn">Create Shortlink</button>
    </div>

    <div class="results" id="results"></div>
    <div class="footer">Powered by slicedrivee.site</div>
  </div>

  <script>
    let mode='single';
    const API='https://slicedrive-short.pengecrotan45.workers.dev';

    function setMode(m){
      mode=m;
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('singleBox').classList.toggle('hidden',m!=='single');
      document.getElementById('bulkBox').classList.toggle('hidden',m!=='bulk');
      document.getElementById('results').innerHTML='';
    }

    async function createOne(target,custom=''){
      const domain=document.getElementById('domain').value;
      const res=await fetch(API,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({target,custom,domain})
      });
      return await res.json();
    }

    function addResult(link){
      const box=document.getElementById('results');
      const div=document.createElement('div');
      div.className='result';
      div.innerHTML=`<a href="${link}" target="_blank">${link}</a><button class="copy" onclick="navigator.clipboard.writeText('${link}')">Copy</button>`;
      box.appendChild(div);
    }

    document.getElementById('btn').onclick=async()=>{
      const btn=document.getElementById('btn');
      btn.disabled=true;
      const results=document.getElementById('results');
      results.innerHTML='';
      try{
        if(mode==='single'){
          const target=document.getElementById('target').value.trim();
          const custom=document.getElementById('custom').value.trim();
          const data=await createOne(target,custom);
          if(!data.ok){alert('Error: '+data.error);btn.disabled=false;return;}
          addResult(data.link);
        }else{
          const urls=document.getElementById('bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);
          let links=[];
          for(const url of urls){
            const data=await createOne(url,'');
            if(data.ok){addResult(data.link);links.push(data.link);}
          }
          document.getElementById('bulkCopyAll').onclick=()=>{navigator.clipboard.writeText(links.join('\n'));}
          alert(`Bulk done. ${links.length}/${urls.length} created`);
        }
      }catch(e){alert('Error: '+e.message);}
      finally{btn.disabled=false;}
    }
  </script>
</body>
</html>
