<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Slicedrive Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: #020617;
  color: white;
  padding: 20px;
}

h1 { margin-bottom: 10px; }

.box {
  background: #0f172a;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}

button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #334155;
  color: white;
}

.result {
  margin-top: 10px;
  white-space: pre-wrap;
  word-break: break-all;
  background: #020617;
  padding: 10px;
  border-radius: 8px;
}

.progress {
  margin-top: 10px;
  height: 8px;
  background: #1e293b;
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #22c55e;
}
</style>
</head>

<body>

<h1>🚀 Slicedrive Panel</h1>

<!-- SINGLE -->
<div class="box">
  <h3>Single Generator</h3>
  <input id="singleUrl" placeholder="https://example.com">
  <button onclick="genSingle()">Generate</button>
  <div class="result" id="singleResult"></div>
</div>

<!-- BULK -->
<div class="box">
  <h3>Bulk Generator</h3>
  <textarea id="bulkUrls" rows="6" placeholder="1 link per baris..."></textarea>
  
  <button onclick="genBulk()">Generate Bulk</button>
  <button class="secondary" onclick="copyAll()">Copy All</button>

  <div class="progress">
    <div class="bar" id="progressBar"></div>
  </div>

  <div class="result" id="bulkResult"></div>
</div>

<script>
const API_KEY = "bebas_isi_sendiri_123";

// SINGLE
async function genSingle() {
  const url = document.getElementById("singleUrl").value;
  if (!url) return alert("Isi link dulu");

  const res = await fetch(`/create?url=${encodeURIComponent(url)}&key=${API_KEY}`);
  const data = await res.json();

  document.getElementById("singleResult").innerHTML =
    `${data.short} <button onclick="copyText('${data.short}')">Copy</button>`;
}

// BULK
async function genBulk() {
  const raw = document.getElementById("bulkUrls").value;
  const urls = raw.split("\n").filter(x => x.trim() !== "");

  if (urls.length === 0) return alert("Isi link dulu");

  let hasil = "";
  let done = 0;

  for (let i = 0; i < urls.length; i++) {
    const url = urls[i].trim();

    try {
      const res = await fetch(`/create?url=${encodeURIComponent(url)}&key=${API_KEY}`);
      const data = await res.json();
      hasil += data.short + "\n";
    } catch {
      hasil += "ERROR: " + url + "\n";
    }

    done++;
    updateProgress(done, urls.length);
    document.getElementById("bulkResult").innerText = hasil;
  }
}

// PROGRESS BAR
function updateProgress(done, total) {
  const percent = (done / total) * 100;
  document.getElementById("progressBar").style.width = percent + "%";
}

// COPY TEXT
function copyText(text) {
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

// COPY ALL
function copyAll() {
  const text = document.getElementById("bulkResult").innerText;
  navigator.clipboard.writeText(text);
  alert("Semua link berhasil di-copy!");
}
</script>

</body>
</html>
