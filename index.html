<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slicedrive</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111827;
  --border:#1f2937;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --primary:#6366f1;
}

body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(180deg,#020617,#0b1220);
  color:var(--text);
}

/* HERO */
.hero{
  text-align:center;
  padding:50px 20px 25px;
}

.hero h1{
  font-size:32px;
  margin:0;
}

.hero p{
  color:var(--muted);
  margin-top:8px;
}

/* CONTAINER */
.container{
  max-width:780px;
  margin:auto;
  padding:16px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.6);

  animation:pop .35s cubic-bezier(.2,1.4,.4,1);
}

@keyframes pop{
  0%{transform:scale(.9) translateY(30px); opacity:0}
  100%{transform:scale(1); opacity:1}
}

/* TABS */
.tabs{
  display:flex;
  background:#020617;
  border-radius:14px;
  margin-bottom:16px;
}

.tab{
  flex:1;
  text-align:center;
  padding:14px;
  cursor:pointer;
  color:var(--muted);
  font-size:14px;
  transition:.15s;
}

.tab.active{
  background:var(--card);
  color:white;
  border-radius:14px;
  transform:scale(1.05);
}

/* INPUT */
input,textarea{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
  margin-top:10px;
  font-size:15px;
}

input:focus, textarea:focus{
  outline:none;
  border-color:#6366f1;
  box-shadow:0 0 0 2px rgba(99,102,241,.3);
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  margin-top:16px;
  border:none;
  border-radius:14px;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(90deg,#6366f1,#3b82f6);
  color:white;

  transform:scale(1);
  transition:transform .08s ease, box-shadow .08s ease;
  box-shadow:0 6px 0 #1e40af;
}

button:hover{
  transform:scale(1.03);
}

button:active{
  transform:scale(0.96) translateY(3px);
  box-shadow:0 2px 0 #1e40af;
}

/* LOADING */
.loading{
  text-align:center;
  margin-top:10px;
  font-size:13px;
  opacity:.7;
}

/* RESULT */
.result{
  margin-top:16px;
  background:#020617;
  border:1px solid var(--border);
  padding:14px;
  border-radius:14px;
  font-size:14px;
  white-space:pre-wrap;

  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{transform:translateY(15px); opacity:0}
  to{transform:translateY(0); opacity:1}
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  padding:12px 18px;
  border-radius:12px;
  opacity:0;
  transition:.3s;
}
.toast.show{opacity:1}

/* DESKTOP */
@media(min-width:900px){
  .hero h1{font-size:38px;}
  .container{max-width:900px;}
}
</style>
</head>

<body>

<div class="hero">
  <h1>🚀 Slicedrive</h1>
  <p>Fast & clean shortlink generator</p>
</div>

<div class="container">

<div class="card">

<div class="tabs">
  <div class="tab active" onclick="switchTab('single',event)">Single URL</div>
  <div class="tab" onclick="switchTab('bulk',event)">Bulk URL</div>
</div>

<div id="singleBox">
  <input id="singleUrl" placeholder="Paste your long URL here">
</div>

<div id="bulkBox" style="display:none;">
  <textarea id="bulkUrls" rows="6" placeholder="1 link per baris"></textarea>
</div>

<button id="btn" onclick="generate()">Create Link</button>

<div class="loading" id="loading" style="display:none;">Processing...</div>

<div class="result" id="result"></div>

</div>

</div>

<div class="toast" id="toast">Copied</div>

<script>
const API_KEY="bebas_isi_sendiri_123";
let mode="single";

function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1500);
}

function switchTab(type,e){
  mode=type;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  e.target.classList.add("active");

  document.getElementById("singleBox").style.display = type==="single"?"block":"none";
  document.getElementById("bulkBox").style.display = type==="bulk"?"block":"none";
}

async function generate(){
  const btn=document.getElementById("btn");
  const loading=document.getElementById("loading");
  const result=document.getElementById("result");

  btn.innerText="Processing...";
  loading.style.display="block";
  result.innerText="";

  if(mode==="single"){
    const url=document.getElementById("singleUrl").value;
    if(!url){reset(); return;}

    const res=await fetch(`/create?url=${encodeURIComponent(url)}&key=${API_KEY}`);
    const data=await res.json();

    result.innerText=data.short;
    navigator.clipboard.writeText(data.short);
    showToast("Copied");
  }

  else{
    const raw=document.getElementById("bulkUrls").value;
    const urls=raw.split("\n").filter(x=>x.trim());

    let hasil="";

    for(let i=0;i<urls.length;i++){
      try{
        const res=await fetch(`/create?url=${encodeURIComponent(urls[i])}&key=${API_KEY}`);
        const data=await res.json();
        hasil += (i+1)+". "+data.short+"\n";
      }catch{
        hasil += (i+1)+". ERROR\n";
      }
    }

    result.innerText=hasil;
    navigator.clipboard.writeText(hasil);
    showToast("Bulk copied");
  }

  reset();
}

function reset(){
  document.getElementById("btn").innerText="Create Link";
  document.getElementById("loading").style.display="none";
}
</script>

</body>
</html>
