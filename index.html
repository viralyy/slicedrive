<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Slicedrive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f8fafc;
  color: #0f172a;
}

/* HEADER */
.header {
  padding: 16px;
  background: white;
  border-bottom: 1px solid #e2e8f0;
  text-align: center;
  font-weight: bold;
}

/* CONTAINER */
.container {
  padding: 16px;
  max-width: 500px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

/* TEXT */
h2 {
  margin: 0 0 10px;
  font-size: 18px;
}

/* INPUT */
input, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
  margin-top: 10px;
  font-size: 14px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}

.primary {
  background: #2563eb;
  color: white;
}

.secondary {
  background: #e2e8f0;
}

/* RESULT */
.result {
  margin-top: 10px;
  background: #f1f5f9;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  word-break: break-all;
  white-space: pre-wrap;
}

/* PROGRESS */
.progress {
  height: 6px;
  background: #e2e8f0;
  margin-top: 10px;
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
}

/* SMALL TEXT */
.note {
  font-size: 12px;
  color: #64748b;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="header">
  🚀 Slicedrive
</div>

<div class="container">

<!-- SINGLE -->
<div class="card">
  <h2>Generate Link</h2>

  <input id="singleUrl" placeholder="https://example.com">
  
  <button class="primary" onclick="genSingle()">Generate</button>

  <div class="result" id="singleResult"></div>
  <div class="note">Auto copy setelah generate</div>
</div>

<!-- BULK -->
<div class="card">
  <h2>Bulk Generator</h2>

  <textarea id="bulkUrls" rows="5" placeholder="1 link per baris"></textarea>

  <button class="primary" onclick="genBulk()">Generate Bulk</button>
  <button class="secondary" onclick="copyAll()">Copy All</button>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="result" id="bulkResult"></div>
</div>

</div>

<script>
const API_KEY = "bebas_isi_sendiri_123";

// SINGLE
async function genSingle() {
  const url = document.getElementById("singleUrl").value;
  if (!url) return alert("Isi link dulu");

  const res = await fetch(`/create?url=${encodeURIComponent(url)}&key=${API_KEY}`);
  const data = await res.json();

  navigator.clipboard.writeText(data.short);

  document.getElementById("singleResult").innerText =
    "✅ " + data.short;
}

// BULK
async function genBulk() {
  const raw = document.getElementById("bulkUrls").value;
  const urls = raw.split("\n").filter(x => x.trim());

  let hasil = "";
  let done = 0;

  for (let i = 0; i < urls.length; i++) {
    try {
      const res = await fetch(`/create?url=${encodeURIComponent(urls[i])}&key=${API_KEY}`);
      const data = await res.json();
      hasil += (i+1) + ". " + data.short + "\n";
    } catch {
      hasil += (i+1) + ". ERROR\n";
    }

    done++;
    document.getElementById("bar").style.width = (done/urls.length)*100 + "%";
    document.getElementById("bulkResult").innerText = hasil;
  }
}

// COPY ALL
function copyAll() {
  const text = document.getElementById("bulkResult").innerText;
  navigator.clipboard.writeText(text);
  alert("Semua link di-copy!");
}
</script>

</body>
</html>
