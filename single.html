<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slicedrivee - Single Shortlink</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Slicedrivee Shortlink</h1>
  <p>Masukkan URL tunggal untuk membuat shortlink cepat</p>
</header>

<div class="container">
  <select id="domain">
    <option value="cdn.slicedrivee.site">cdn.slicedrivee.site</option>
    <option value="cdn2.slicedrivee.site">cdn2.slicedrivee.site</option>
    <option value="media.slicedrivee.site">media.slicedrivee.site</option>
  </select>

  <input type="text" id="url" placeholder="Masukkan URL panjang disini">
  <input type="text" id="slug" placeholder="Custom alias (opsional)">
  <button onclick="createShortlink()">Create Link</button>

  <div class="result" id="result"></div>
</div>

<footer>
  © 2026 slicedrivee.site
</footer>

<script>
async function createShortlink() {
  const url = document.getElementById('url').value.trim();
  const slug = document.getElementById('slug').value.trim();
  const domain = document.getElementById('domain').value;

  if(!url) return alert('Masukkan URL dulu!');

  const res = await fetch('https://slicedrivee.pengecrotan45.workers.dev', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({target:url, slug, domain})
  });

  const data = await res.json();
  document.getElementById('result').innerText = data.ok ? `Shortlink: ${data.shortlink}` : `Error: ${data.error}`;
}
</script>

</body>
</html>
